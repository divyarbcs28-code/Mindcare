services:
  # Node.js Express Backend
  - type: web
    name: mindcare-api-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      # Keep MONGO_URI configured as a secret in the Render Dashboard, not in source control.
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: PORT
        value: 5003

  # React Frontend (Static Site on Render)
  - type: web
    name: mindcare-frontend-divya-2026
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mindcare-api-backend
          envVarKey: RENDER_EXTERNAL_URL
