services:
  # Node.js Express Backend
  - type: web
    name: mindcare-api-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        value: mongodb+srv://Divyar:Ramkoki07@cluster0.45vnhds.mongodb.net/mindcare?appName=Cluster0
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: PORT
        value: 5003

  # React Frontend (Static Site on Render)
  - type: web
    name: mindcare-frontend-divya-2026
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mindcare-api-backend
          property: host
